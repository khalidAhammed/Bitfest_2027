---
# Copied to the root of the `cpanel` branch as .cpanel.yml by .github/workflows/cpanel-build.yml.
# cPanel runs these tasks on "Deploy HEAD Commit" (Git Version Control). The BdREN server has no
# rsync for accounts, so this uses cp: build folders that change every build (_next, events) are
# cleared first so old files do not pile up, then the whole build is copied over public_html.
# cPanel's own files (.well-known, cgi-bin, .user.ini) are never touched.
deployment:
  tasks:
    - export DEPLOYPATH=/home/csefestkuet/public_html
    - /bin/rm -rf "$DEPLOYPATH/_next" "$DEPLOYPATH/events"
    - /bin/cp -R ./* ./.htaccess "$DEPLOYPATH/"
